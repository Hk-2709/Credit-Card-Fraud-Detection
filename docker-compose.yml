version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ccf_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - MODELS_DIR=/app/models

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: ccf_ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
